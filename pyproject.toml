[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlhat-rebuild"
version = "0.1.0"
description = "Independent, staged reimplementation for an MLHAT term project"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
tracking = ["wandb>=0.18"]

[tool.setuptools.packages.find]
where = ["src"]
